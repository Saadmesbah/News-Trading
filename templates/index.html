<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Sentiment Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; }

    header {
      background: #1a1d2e;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.3rem; font-weight: 500; color: #fff; }
    header span { font-size: 13px; color: #666; }

    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

    .search-bar { display: flex; gap: 10px; margin-bottom: 2rem; }
    .search-bar input {
      flex: 1;
      padding: 10px 14px;
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
    }
    .search-bar input:focus { outline: none; border-color: #4f8ef7; }
    .search-bar button {
      padding: 10px 20px;
      background: #4f8ef7;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .search-bar button:hover { background: #3a7be0; }
    .btn-reset {
      padding: 10px 20px;
      background: #2a2d3e;
      border: none;
      border-radius: 8px;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
    }

    .cards { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .card-header .date { font-size: 13px; color: #888; }
    .card-header .asset {
      background: #4f8ef720;
      color: #4f8ef7;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 1rem;
    }
    .score-box {
      background: #0f1117;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .score-box .label { font-size: 11px; color: #666; margin-bottom: 4px; }
    .score-box .value { font-size: 20px; font-weight: 500; }
    .positive { color: #1D9E75; }
    .negative { color: #E24B4A; }
    .neutral  { color: #888; }

    .composite {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #0f1117;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .composite .label { font-size: 12px; color: #888; }
    .composite .value { font-size: 22px; font-weight: 500; }

    .rationale {
      font-size: 13px;
      color: #888;
      font-style: italic;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .card-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .btn-edit {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid #4f8ef744;
      border-radius: 6px;
      color: #4f8ef7;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-edit:hover { background: #4f8ef722; }

    .btn-delete {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid #E24B4A44;
      border-radius: 6px;
      color: #E24B4A;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-delete:hover { background: #E24B4A22; }

    .empty {
      text-align: center;
      padding: 4rem;
      color: #444;
      font-size: 14px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 12px;
      padding: 1.5rem;
      width: 360px;
    }
    .modal h3 { font-size: 15px; margin-bottom: 1rem; color: #fff; }
    .modal label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    .modal input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .btn-save {
      padding: 7px 16px;
      background: #1D9E75;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-cancel {
      padding: 7px 16px;
      background: #2a2d3e;
      border: none;
      border-radius: 6px;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>Crypto Sentiment Dashboard</h1>
  <span id="doc-count"></span>
</header>

<div class="container">
  <div class="search-bar">
    <input type="text" id="keyword-input" placeholder="Search by keyword (e.g. Iran, ETF, Fed...)">
    <input type="date" id="date-input">
    <button onclick="search()">Search</button>
    <button class="btn-reset" onclick="loadAll()">Reset</button>
  </div>

  <div class="cards" id="cards-container">
    <div class="empty">Loading...</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Edit Scores</h3>
    <input type="hidden" id="edit-id">

    <label>Bitcoin Score (-1.0 to +1.0)</label>
    <input type="number" id="edit-btc" step="0.01" min="-1" max="1">

    <label>Crypto Score (-1.0 to +1.0)</label>
    <input type="number" id="edit-crypto" step="0.01" min="-1" max="1">

    <label>Politics Score (-1.0 to +1.0)</label>
    <input type="number" id="edit-pol" step="0.01" min="-1" max="1">

    <label>War/Macro Score (-1.0 to +1.0)</label>
    <input type="number" id="edit-war" step="0.01" min="-1" max="1">

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>
  // Scores stored in JS — never injected into HTML attributes
  const scoresMap = {};

  function openEdit(id) {
    const scores = scoresMap[id] || {};
    document.getElementById('edit-id').value     = id;
    document.getElementById('edit-btc').value    = scores.bitcoin_score   ?? 0;
    document.getElementById('edit-crypto').value = scores.crypto_score    ?? 0;
    document.getElementById('edit-pol').value    = scores.politics_score  ?? 0;
    document.getElementById('edit-war').value    = scores.war_macro_score ?? 0;
    document.getElementById('modal').classList.add('active');
  }

  function closeEdit() {
    document.getElementById('modal').classList.remove('active');
  }

  async function saveEdit() {
    const id = document.getElementById('edit-id').value;
    const updated = {
      scores: {
        bitcoin_score:   parseFloat(document.getElementById('edit-btc').value),
        crypto_score:    parseFloat(document.getElementById('edit-crypto').value),
        politics_score:  parseFloat(document.getElementById('edit-pol').value),
        war_macro_score: parseFloat(document.getElementById('edit-war').value),
      }
    };
    await fetch(`/api/update/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updated)
    });
    closeEdit();
    loadAll();
  }

  function scoreColor(val) {
    if (val > 0.05)  return 'positive';
    if (val < -0.05) return 'negative';
    return 'neutral';
  }

  function scoreSign(val) {
    return val > 0 ? '+' + val.toFixed(2) : val.toFixed(2);
  }

  function renderCards(docs) {
    const container = document.getElementById('cards-container');
    document.getElementById('doc-count').textContent =
      `${docs.length} record${docs.length !== 1 ? 's' : ''}`;

    if (docs.length === 0) {
      container.innerHTML = '<div class="empty">No results found.</div>';
      return;
    }

    docs.forEach(doc => { scoresMap[doc._id] = doc.scores || {}; });

    container.innerHTML = docs.map(doc => {
      const s         = doc.scores || {};
      const composite = doc.composite_score ?? 0;
      return `
        <div class="card" id="card-${doc._id}">
          <div class="card-header">
            <span class="date">${doc.date} &nbsp;·&nbsp; ${doc.headline_count} headlines</span>
            <span class="asset">${doc.asset}</span>
          </div>
          <div class="scores">
            <div class="score-box">
              <div class="label">Bitcoin</div>
              <div class="value ${scoreColor(s.bitcoin_score)}">${scoreSign(s.bitcoin_score ?? 0)}</div>
            </div>
            <div class="score-box">
              <div class="label">Crypto</div>
              <div class="value ${scoreColor(s.crypto_score)}">${scoreSign(s.crypto_score ?? 0)}</div>
            </div>
            <div class="score-box">
              <div class="label">Politics</div>
              <div class="value ${scoreColor(s.politics_score)}">${scoreSign(s.politics_score ?? 0)}</div>
            </div>
            <div class="score-box">
              <div class="label">War / Macro</div>
              <div class="value ${scoreColor(s.war_macro_score)}">${scoreSign(s.war_macro_score ?? 0)}</div>
            </div>
          </div>
          <div class="composite">
            <span class="label">Composite score (P)</span>
            <span class="value ${scoreColor(composite)}">${scoreSign(composite)}</span>
          </div>
          <div class="rationale">"${doc.brief_rationale}"</div>
          <div class="card-actions">
            <button class="btn-edit" onclick="openEdit('${doc._id}')">Edit Scores</button>
            <button class="btn-delete" onclick="deleteDoc('${doc._id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadAll() {
    document.getElementById('keyword-input').value = '';
    document.getElementById('date-input').value    = '';
    const res  = await fetch('/api/all');
    const docs = await res.json();
    renderCards(docs);
  }

  async function search() {
    const keyword = document.getElementById('keyword-input').value.trim();
    const date    = document.getElementById('date-input').value;
    let url = '/api/search?';
    if (keyword) url += `keyword=${encodeURIComponent(keyword)}`;
    else if (date) url += `date=${date}`;
    const res  = await fetch(url);
    const docs = await res.json();
    renderCards(docs);
  }

  async function deleteDoc(id) {
    if (!confirm('Delete this record?')) return;
    await fetch(`/api/delete/${id}`, { method: 'DELETE' });
    document.getElementById(`card-${id}`).remove();
    const count = document.querySelectorAll('.card').length;
    document.getElementById('doc-count').textContent =
      `${count} record${count !== 1 ? 's' : ''}`;
  }

  loadAll();
</script>

</body>
</html>
